name: "Analytics Modeling Lab CI"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: "Linting (SQL & Python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install sqlfluff flake8 black

      - name: Lint SQL (dbt)
        run: |
          sqlfluff lint transform/dbt/models --dialect postgres

      - name: Lint Python
        run: |
          flake8 ingestion orchestration orchestration/dagster/dagster_project

  dbt-validate:
    name: "dbt Structural Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install dbt-postgres dagster-dbt

      - name: dbt Parse (Check Syntax & Lineage)
        run: |
          cd transform/dbt
          dbt parse --profiles-dir .
        env:
          DBT_HOST: localhost
          DBT_USER: demo
          DBT_PASSWORD: demo
          DBT_PORT: 5432
          DBT_DBNAME: modeling_lab
          DBT_SCHEMA: public

  dagster-validate:
    name: "Dagster Dry-Run"
    runs-on: ubuntu-latest
    needs: dbt-validate
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install dagster dagster-pipes dagster-dbt pandas soda-core-postgres dbt-postgres

      - name: Validate Dagster Definitions
        run: |
          # Add current directory to PYTHONPATH so it can find the 'orchestration' module
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # Set absolute path for dbt project to avoid relative path confusion
          export DBT_PROJECT_DIR=$(pwd)/transform/dbt
          # Run dbt parse from the project dir to ensure manifest.json exists for asset loading
          cd transform/dbt && dbt parse --profiles-dir . && cd ../..
          # Now run the validation script from the root
          python ops/ci_validate_dagster.py
        env:
          DAGSTER_HOME: /tmp
