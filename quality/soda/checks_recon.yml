# Reconciliation: Ensuring transformation integrity

checks for public.stg_secop__contracts_api:
  - row_count > 0:
      name: Staging is not empty
      attributes:
        layer: staging

  # Cross-schema reconciliation using a custom query check
  - failed rows:
      name: Volume Reconciliation (Staged vs Raw Unique Contracts)
      attributes:
        layer: reconciliation
      fail condition: |
        (SELECT count(*) FROM public.stg_secop__contracts_api) != 
        (SELECT count(distinct id_contrato) FROM raw.secop_contracts)