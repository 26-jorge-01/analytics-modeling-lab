# Soda Checks: The Data Health Guard

# 1. Monitoring the "Raw" entry point (Staging/Raw)
# Tag: raw
checks for orders:
  - row_count > 0:
      name: Ensure source orders are not empty
      attributes:
        layer: raw

  - schema:
      name: Source Schema Guard (Orders)
      attributes:
        layer: raw
      fail:
        when required column missing:
          - order_id
          - customer_id
          - order_status