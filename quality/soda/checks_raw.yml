# Soda Checks: The Data Health Guard

# -- SECOP CONTRACTS --
checks for secop_contracts:
  - row_count > 0:
      name: Ensure source is not empty
      attributes:
        layer: raw

  - duplicate_count(hash_id) = 0:
      name: Source Uniqueness Guard (Primary hash_id)
      attributes:
        layer: raw

  - duplicate_count(id_contrato, proceso_de_compra, documento_proveedor, codigo_entidad, ultima_actualizacion, source):
      name: Business PK Overlap (Warning)
      warn: when > 0
      attributes:
        layer: raw

  - missing_count(id_contrato) = 0
  - missing_count(nit_entidad) = 0
  - missing_count(nombre_entidad) = 0
  - missing_count(valor_del_contrato) = 0

  - min_contract_value >= 0:
      name: Contract Value Sanity (No negative amounts)
      min_contract_value query: |
        SELECT MIN(CAST(NULLIF(valor_del_contrato, '') AS NUMERIC))
        FROM secop_contracts
      attributes:
        layer: raw

  - schema:
      name: Source Schema Guard (SECOP Contracts)
      attributes:
        layer: raw
      fail:
        when required column missing:
          - nombre_entidad
          - nit_entidad
          - id_contrato
          - proceso_de_compra
          - valor_del_contrato
          - ultima_actualizacion

  - nit_length_sanity:
      name: NIT Length Distribution (Short NIT Warning)
      warn: when > 50
      nit_length_sanity query: |
        SELECT count(*) FROM secop_contracts 
        WHERE LENGTH(split_part(nit_entidad, '-', 1)) < 8
      attributes:
        layer: raw

# -- AGENCY OVERRIDES --
checks for agency_overrides:
  - row_count > 0:
      name: Ensure manual override seed is not empty
      attributes:
        layer: raw

  - duplicate_count(raw_nit_entidad) = 0:
      name: Seed Raw NIT Uniqueness Guard (No conflicting rules)
      attributes:
        layer: raw

  - missing_count(raw_nit_entidad) = 0:
      name: Raw NIT must not be null
      attributes:
        layer: raw

  - missing_count(canonical_nit_entidad) = 0:
      name: Canonical NIT must not be null
      attributes:
        layer: raw

# -- AGENCY ACRONYMS --
checks for agency_acronyms:
  - row_count > 0:
      name: Ensure acronym dictionary is not empty
      attributes:
        layer: raw

  - duplicate_count(acronym) = 0:
      name: Acronym Uniqueness Guard (No conflicting definitions)
      attributes:
        layer: raw

  - missing_count(acronym) = 0:
      name: Acronym must not be null
      attributes:
        layer: raw

  - missing_count(expanded_name) = 0:
      name: Expanded name must not be null
      attributes:
        layer: raw