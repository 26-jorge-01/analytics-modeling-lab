# Soda Checks: The Data Health Guard

# 1. Monitoring the "Raw" entry point (Staging/Raw)
# -- SECOP --
checks for secop_contracts:
  - row_count > 0:
      name: Ensure source is not empty
      attributes:
        layer: raw

  - duplicate_count(hash_id) = 0:
      name: Source Uniqueness Guard (Primary hash_id)
      attributes:
        layer: raw

  - duplicate_count(id_contrato, proceso_de_compra, documento_proveedor, codigo_entidad, ultima_actualizacion, source):
      name: Business PK Overlap (Warning)
      warn: when > 0
      attributes:
        layer: raw

  - missing_count(id_contrato) = 0
  - missing_count(nit_entidad) = 0
  - missing_count(nombre_entidad) = 0
  - missing_count(valor_del_contrato) = 0

  - min_contract_value >= 0:
      name: Contract Value Sanity (No negative amounts)
      min_contract_value query: |
        SELECT MIN(CAST(NULLIF(valor_del_contrato, '') AS NUMERIC))
        FROM raw.secop_contracts
      attributes:
        layer: raw

  # - TODO: Implementar freshness check luego de estabilizar el proceso
  # - freshness(ultima_actualizacion) < 72h:
  #     name: Ingestion Freshness (Latest update < 72h)
  #     attributes:
  #       layer: raw

  - schema:
      name: Source Schema Guard (SECOP Contracts)
      attributes:
        layer: raw
      fail:
        when required column missing:
          - nombre_entidad
          - nit_entidad
          - id_contrato
          - proceso_de_compra
          - valor_del_contrato
          - ultima_actualizacion