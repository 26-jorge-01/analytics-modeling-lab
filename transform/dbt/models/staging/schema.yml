version: 2

models:
  - name: stg_olist__customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_olist__orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__customers')
              field: customer_id

  - name: stg_olist__products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_olist__order_items
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__products')
              field: product_id
