version: 2

sources:
  - name: secop
    schema: raw
    description: "Unified Matrix for Colombian Procurement (SECOP I & II) ingested via Socrata API."
    tables:
      - name: raw_secop_api_contracts
        description: "Main consolidated contracts table. Unified schema containing 100+ raw columns from both SECOP versions."
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        loaded_at_field: ultima_actualizacion

  - name: cuentame
    schema: raw
    description: "Raw Cuentame dataset ingested from EXCEL files."
    tables:
      - name: info_contratos_unicos
        description: "Info contratos unicos."
      - name: info_entidades_administradoras_servicio
        description: "Info entidades administradoras de servicio."
      - name: reporte_unidades_2024
        description: "Reporte unidades 2024."
      - name: reporte_unidades_2025
        description: "Reporte unidades 2025."
      - name: reporte_unidades_2026
        description: "Reporte unidades 2026."

