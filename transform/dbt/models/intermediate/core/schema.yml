version: 2

models:
  - name: core_customers
    description: "Operational Source of Truth for Customers. This model provides the latest, deduplicated state of all customer entities, drawing directly from the Data Vault memory. It enforces strict data quality and is the foundation for all customer-centric analytics."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: core_products
    description: "Operational Source of Truth for Products. Consolidates product attributes and category translations into a clean, normalized structure, ensuring that every product has a valid, unified profile."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: core_orders
    description: "Operational Source of Truth for Orders. Tracks the current valid state of every purchase, ensuring that all orders are correctly linked to verified customers and that timestamps are consistent for operational reporting."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('core_customers')
              field: customer_id

  - name: core_order_items
    description: "Operational Source of Truth for Individual Order Line Items. This atomic transactional layer ensures that every item in an order is correctly priced and linked to the catalog, maintaining financial integrity across the warehouse."
    columns:
      - name: order_item_key
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('core_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('core_products')
              field: product_id
