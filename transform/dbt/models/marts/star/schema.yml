version: 2

models:
  - name: dim_customer
    description: "Dimension table containing customer attributes, with one row per customer."
    columns:
      - name: customer_id
        description: "Primary key for the customer dimension."
        tests:
          - unique
          - not_null

  - name: dim_product
    description: "Dimension table containing product attributes, including category and dimensions."
    columns:
      - name: product_id
        description: "Primary key for the product dimension."
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Time dimension table for analytical reporting, containing dates, month, year, etc."
    columns:
      - name: date_key
        description: "Primary key for the date dimension (YYYYMMDD format)."
        tests:
          - unique
          - not_null

  - name: fct_order_item
    description: "Fact table containing individual items from each order, providing transactional context for analytics."
    columns:
      - name: order_item_key
        description: "Primary key for the fact table (hash of order_id and order_item_id)."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to the source order."
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key linking to dim_customer."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        description: "Foreign key linking to dim_product."
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: order_date
        description: "Date when the order was placed, linking to dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
